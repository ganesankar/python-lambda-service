service: python-lambda-service

provider:
  name: aws
  runtime: python3.9
  stage: dev
  region: us-west-2

functions:
  hello:
    handler: src/handler.hello
    events:
      - http:
          path: hello
          method: get

plugins:
  - serverless-offline

package:
  exclude:
    - '**/*'
  include:
    - src/**
